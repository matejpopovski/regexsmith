[project]
name = "regexsmith"
version = "0.1.0"
description = "A hand-written transformer that writes regexes from examples and proves each candidate by running it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0", "torch>=2.5"]

[project.scripts]
regexsmith = "regexsmith.cli:main"

[dependency-groups]
dev = ["hypothesis>=4.0", "pytest>=8.0", "ruff>=0.6"]
report = ["matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regexsmith"]

# GitHub runners are CPU-only, and the default Linux wheels of torch drag in
# several GB of CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: takes more than a few seconds"]
